name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gameplay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock puppeteer
      - name: Run gameplay regression check
        run: node scripts/gameplay-regression.js

  itch-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate itch.io package
        run: python3 scripts/package-itch.py --check
